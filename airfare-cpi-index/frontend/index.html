  <!-- Instant theme resolver to prevent flash of wrong theme -->
  <script>
    (function() {
      try {
        // One-time localStorage migration: read legacy keys (afpi_theme, aieindex_theme), migrate to airindex_theme, and delete old keys
        var savedTheme = localStorage.getItem('airindex_theme');
        if (!savedTheme) {
          var legacyTheme = localStorage.getItem('afpi_theme') || localStorage.getItem('aieindex_theme');
          if (legacyTheme) {
            savedTheme = legacyTheme;
            localStorage.setItem('airindex_theme', legacyTheme);
            localStorage.removeItem('afpi_theme');
            localStorage.removeItem('aieindex_theme');
          }
        }
        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
