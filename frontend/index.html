<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoSPI AFPI - Real-time Airfare Price Index for India | SIH Project</title>
  <meta name="description" content="Automated Web Scraping of Airline & OTA Portals for Augmentation of the Consumer Price Index (CPI) - Smart India Hackathon" />

  <!-- Instant theme resolver to prevent flash of wrong theme -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('afpi_theme');
        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            saffron: {
              400: '#FFA040',
              500: '#FF671F',
              600: '#E65100',
              700: '#C63F00'
            },
            indiaGreen: {
              500: '#046A38',
              600: '#03522B'
            },
            navy: {
              800: '#1E3E62',
              900: '#0B192C',
              950: '#070D1E'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Merriweather', 'Cinzel', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->

  <!-- React 18 & ReactDOM & Babel CDN -->
